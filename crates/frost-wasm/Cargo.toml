[package]
name = "frost-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings over the Zcash Foundation's re-randomized FROST (RedPallas) for Hima. Unaudited, demo only."
repository = "https://github.com/avishrakshe/Hima"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# reddsa 0.5.2 is the last Zcash Foundation release that ships the `frost`
# feature (RedPallas / RedJubjub ciphersuites over frost-rerandomized 3.x).
# reddsa 0.6.x removed it, so this is pinned exactly.
reddsa = { version = "=0.5.2", features = ["frost"] }
frost-rerandomized = "3.0.0"
rand_core = { version = "0.6", features = ["getrandom"] }
# rand_core 0.6 -> getrandom 0.2, which needs the "js" feature on wasm32 to
# pull randomness from the browser's crypto.getRandomValues().
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
